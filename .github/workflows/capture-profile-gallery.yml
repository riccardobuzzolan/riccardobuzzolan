name: Capture profile project gallery
on:
  pull_request:
    paths:
      - .github/workflows/capture-profile-gallery.yml
permissions:
  contents: write
jobs:
  gallery:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Capture live project pages
        run: |
          mkdir -p docs/images
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=7000 --window-size=1200,750 --screenshot=docs/images/portfolio.png 'https://riccardobuzzolan.github.io/'
          test -s docs/images/portfolio.png
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=7000 --window-size=1200,750 --screenshot=docs/images/ripetizioni.png 'https://riccardobuzzolan.github.io/SitoRiccardoBuzzolan/'
          test -s docs/images/ripetizioni.png
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --virtual-time-budget=7000 --window-size=1200,750 --screenshot=docs/images/memory-atlas.png 'https://riccardobuzzolan.github.io/imparacapitalistati/'
          test -s docs/images/memory-atlas.png
      - name: Save captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/portfolio.png docs/images/ripetizioni.png docs/images/memory-atlas.png
          if ! git diff --cached --quiet; then
            git commit -m "Aggiunge schermate reali alla galleria del profilo"
            git push origin HEAD:${{ github.head_ref }}
          fi
