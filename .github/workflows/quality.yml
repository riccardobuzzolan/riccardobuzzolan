name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: redirect-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
      - name: Validate legacy redirect
        run: node scripts/check-redirect.mjs
      - name: Redirect guard regressions
        run: node --test tests/redirect.test.mjs
