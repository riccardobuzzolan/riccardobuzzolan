<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 72 72" role="img" aria-label="RB Riccardo Buzzolan">
<title>RB | Riccardo Buzzolan</title>
<style>
  #letter-r { stroke: #213342; }
  #letter-b, #motion { stroke: #267AD9; }
  #motion {
    transform-origin: 46px 36px;
    animation: unfold 3.2s cubic-bezier(.22,1,.36,1) infinite;
  }
  @keyframes unfold {
    0%, 9% { transform: scaleX(.08); opacity: .45; }
    38%, 76% { transform: scaleX(1); opacity: 1; }
    100% { transform: scaleX(.08); opacity: .45; }
  }
  @media (prefers-color-scheme: dark) {
    #letter-r { stroke: #EAF1F5; }
    #letter-b, #motion { stroke: #6AB5FF; }
  }
  @media (prefers-reduced-motion: reduce) {
    #motion { animation: none; transform: scaleX(1); opacity: 1; }
  }
</style>
