<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Monogramma RB che si compone progressivamente">
<title>Portfolio Riccardo Buzzolan — Monogramma</title><style>
#b{stroke-dasharray:100;stroke-dashoffset:100;animation:write 3.5s cubic-bezier(.4,.02,.2,1) infinite}
#accent{stroke-dasharray:100;stroke-dashoffset:100;animation:line 3.5s cubic-bezier(.22,1,.36,1) infinite}
