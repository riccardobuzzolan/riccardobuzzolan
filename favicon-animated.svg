<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Monogramma RB con reveal geometrico animato">
<title>Riccardo Buzzolan</title><defs><clipPath id="wipe"><rect id="motion" x="31" y="9" width="31" height="47"/></clipPath><linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7458F4"/><stop offset="1" stop-color="#405BF5"/></linearGradient></defs>
<style>
#motion{transform-origin:31px 32px;animation:wipe 3.6s cubic-bezier(.22,1,.36,1) infinite}
#accent{animation:accent 3.6s ease-in-out infinite}
@keyframes wipe{0%,12%{transform:scaleX(.08)}50%,85%{transform:scaleX(1)}100%{transform:scaleX(.08)}}
@keyframes accent{0%,20%,100%{opacity:.3;transform:translateX(-5px)}54%,85%{opacity:1;transform:translateX(0)}}
@media(prefers-color-scheme:dark){#letter-r{stroke:#F0F3FA}}
@media(prefers-reduced-motion:reduce){#motion,#accent{animation:none}}
</style>
<path id="letter-r" d="M7 53V12H23c9 0 14 5 14 13s-5 13-14 13H7m17 0 13 15" fill="none" stroke="#171E30" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="square"/>
<g clip-path="url(#wipe)" fill="none" stroke="url(#ink)" stroke-width="6.8" stroke-linejoin="round" stroke-linecap="square"><path d="M41 12h7c8 0 12 4 12 10 0 7-4 11-12 11h-7m0 0h7c9 0 13 4 13 11 0 6-4 9-13 9h-7V12"/></g>
<path id="accent" d="M42 6h15" stroke="#16C5D8" stroke-width="3.2" stroke-linecap="round"/>
</svg>
